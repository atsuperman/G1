
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Radio Player</title>
  <style>
    body { margin:0; font-family:Arial; background:#000; color:#0f0; text-align:center; padding:20px; }
    #now { font-size:24px; margin:20px; color:#0f0; }
    #art { width:200px; height:200px; border-radius:50%; border:3px solid #0f0; margin:20px auto; background:#111; }
    button { background:#111; color:#0f0; border:2px solid #0f0; padding:10px 20px; margin:10px; cursor:pointer; font-size:18px; }
    button:hover { background:#0f0; color:#000; }
    progress { width:80%; height:10px; margin:10px; }
    marquee { font-size:18px; color:#0f0; }
  </style>
</head>
<body>

  <h1>Radio Player</h1>
  <div id="art"></div>
  <div id="now">Loading station...</div>
  <marquee>Streaming your library...</marquee>

  <audio id="audio" preload="auto"></audio>

  <div>
    <button onclick="playPause()">Play / Pause</button>
    <button onclick="prev()">Prev</button>
    <button onclick="next()">Next</button>
  </div>

  <progress id="prog" value="0" max="100"></progress>

  <ul id="list" style="display:none;">
    <li data-src="Unnai Naan.m4a">Track 1 - Artist</li>
    <li data-src="Vaarai En Thozhi.m4a">Track 2 - Artist</li>
    <li data-src="Yen Endra Kelvi.m4a">Track 3 - Artist</li>
    <!-- Add more <li data-src="filename.mp3">Song Name</li> here -->
  </ul>

<script>
  const audio = document.getElementById('audio');
  const now = document.getElementById('now');
  const prog = document.getElementById('prog');
  const items = document.querySelectorAll('#list li');
  let idx = 0;

  function load(i) {
    if (i >= items.length) i = 0;
    const src = items[i].getAttribute('data-src');
    audio.src = src;
    now.textContent = items[i].textContent;
    audio.play().catch(()=>{});
    idx = i;
  }

  function next() { idx = (idx + 1) % items.length; load(idx); }
  function prev() { idx = (idx - 1 + items.length) % items.length; load(idx); }

  function playPause() {
    if (audio.paused) audio.play();
    else audio.pause();
  }

  audio.onended = next;
  audio.ontimeupdate = () => {
    if (audio.duration) prog.value = (audio.currentTime / audio.duration) * 100;
  };

  // Start radio
  load(0);
</script>
</body>
</html>
